name: CI/CD — Plant Classifier

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/plant-classifier-api
  DOCKER_TAG: ${{ github.sha }}

jobs:
  # ─── 1. Tests & Linting ─────────────────────────────────────────
  test:
    name: Tests & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-asyncio httpx black flake8
          pip install fastapi uvicorn python-multipart pillow pydantic
          pip install python-dotenv

      - name: Lint with flake8
        run: |
          flake8 src/ api/ --max-line-length=100 --ignore=E501,W503

      - name: Format check with black
        run: |
          black --check src/ api/ --line-length=100

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000
          MINIO_ENDPOINT: http://localhost:9000

  # ─── 2. Build & Push Docker Image ───────────────────────────────
  build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          dockerfile: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}

  # ─── 3. Deploy (local Kubernetes via self-hosted runner) ────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update image tag in K8s manifest
        run: |
          sed -i "s|IMAGE_TAG|${{ env.DOCKER_TAG }}|g" k8s/api-deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/plant-classifier-api --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get pods -l app=plant-classifier-api
