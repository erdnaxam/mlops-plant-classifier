name: CI/CD Pipeline — Plant Classifier

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/plant-classifier-api
  DOCKER_IMAGE_WEBAPP: ${{ secrets.DOCKERHUB_USERNAME }}/plant-classifier-webapp

jobs:
  test:
    name: Tests unitaires & intégration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Installer les dépendances
        run: pip install pytest pytest-asyncio httpx fastapi pillow pandas scikit-learn python-dotenv
      - name: Lancer les tests
        run: pytest tests/ -v --tb=short

  build-and-push:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & Push API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:latest
      - name: Build & Push WebApp
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.webapp
          push: true
          tags: ${{ env.DOCKER_IMAGE_WEBAPP }}:latest
