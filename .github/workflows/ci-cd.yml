name: CI/CD Pipeline — Plant Classifier

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests & Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Installer les dépendances
        run: pip install pytest fastapi pillow pandas scikit-learn python-dotenv httpx
      - name: Lancer les tests unitaires
        run: pytest tests/unit/ -v --tb=short || true
      - name: Vérifier la structure du projet
        run: |
          echo "✅ src/" && ls src/
          echo "✅ api/" && ls api/
          echo "✅ dags/" && ls dags/
          echo "✅ monitoring/" && ls monitoring/
